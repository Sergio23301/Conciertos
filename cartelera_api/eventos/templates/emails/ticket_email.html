<!DOCTYPE html>
<html>
<head>
    <style>
        .ticket-card {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            max-width: 500px;
            border: 2px solid #f1c40f;
            border-radius: 15px;
            overflow: hidden;
            margin: 20px auto;
        }
        .header { background-color: #f1c40f; color: #000; padding: 20px; text-align: center; }
        .content { padding: 30px; }
        .artista { font-size: 24px; font-weight: bold; color: #f1c40f; margin-bottom: 10px; }
        .detalle { margin: 10px 0; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .footer { text-align: center; padding: 20px; font-size: 12px; color: #888; }
        .qr-mock { background: white; width: 100px; height: 100px; margin: 20px auto; }
    </style>
</head>
<body>
    <div class="ticket-card">
        <div class="header">
            <h1 style="margin:0;">TICKETLIVE 🎟️</h1>
        </div>
        <div class="content">
            <p>¡Hola <strong>{{ nombre }}</strong>! Gracias por tu compra.</p>
            <div class="artista">{{ artista }}</div>
            <div class="detalle">📍 <strong>Lugar:</strong> {{ lugar }}</div>
            <div class="detalle">🗓️ <strong>Fecha:</strong> {{ fecha }}</div>
            <div class="detalle">💺 <strong>Asiento:</strong> {{ asiento }}</div>
            <div class="detalle">💰 <strong>Total Pagado:</strong> ${{ precio }} MXN</div>
            <div class="qr-mock">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=TicketLive-{{ asiento }}-{{ artista }}" alt="QR Code">
            </div>
            <p style="text-align:center; font-size: 14px;">Presenta este código en la entrada.</p>
        </div>
        <div class="footer">
            Generado por TicketLive System<br>
            Administrador: {{ autor }}
        </div>
    </div>
</body>
</html>
